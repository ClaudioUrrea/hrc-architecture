# Configuration for manuscript electronics-4535423.
# Every quantity produced by this file is SIMULATED: the robot, sensor and PLC
# endpoints are vendor software simulators, not physical equipment.
seed_manifest: config/seeds.json
platform:
  os: Ubuntu 22.04.4 LTS
  kernel: 5.15.0-105 PREEMPT_RT
  isolcpus: [6, 7]
  scheduler: {policy: SCHED_FIFO, priority: 90}
  cpu: Intel Core i7-10700K
  accelerator: NVIDIA Jetson Xavier NX (JetPack 5.1.2, CUDA 11.4, TensorRT 8.5.2, 15 W 6-core)
toolchain:
  compiler: GCC 11.4.0
  std: c++17
  flags: [-O2, -march=native]
  open62541: 1.3.9
  pymodbus: 3.6.6
  ethercat_master: IgH 1.5.2
  qpoases: 3.2.1
simulators:
  cell: CoppeliaSim 4.6.0 rev18 (Bullet 2.78, 5 ms step)
  cameras: 6x Intel RealSense D435 model, 1280x720 @ 30 fps

run:
  name: baseline_svo_cbf
  note: >-
    Baseline parameters are taken unchanged from reference [3] and were NOT
    retuned for this workload. This biases the comparison in favour of the
    proposed method by an amount that has not been quantified (Section 9.7).
  segments: 30
  segment_minutes: 20
  scenarios: [S1, S2, S3]
outputs:
  segments: data/segments_30.parquet
