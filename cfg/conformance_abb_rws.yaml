# Configuration for manuscript electronics-4587969.
# Every quantity produced by this file is SIMULATED: the robot, sensor and PLC
# endpoints are vendor software simulators, not physical equipment.
seed_manifest: config/seeds.json
platform:
  os: Ubuntu 22.04.4 LTS
  kernel: 5.15.0-105 PREEMPT_RT
  isolcpus: [6, 7]
  scheduler: {policy: SCHED_FIFO, priority: 90}
  cpu: Intel Core i7-10700K
  accelerator: NVIDIA Jetson Xavier NX (JetPack 5.1.2, CUDA 11.4, TensorRT 8.5.2, 15 W 6-core)
toolchain:
  compiler: GCC 11.4.0
  std: c++17
  flags: [-O2, -march=native]
  open62541: 1.3.9
  pymodbus: 3.6.6
  ethercat_master: IgH 1.5.2
  qpoases: 3.2.1
simulators:
  cell: CoppeliaSim 4.6.0 rev18 (Bullet 2.78, 5 ms step)
  cameras: 6x Intel RealSense D435 model, 1280x720 @ 30 fps

run:
  name: conformance_abb_rws
  description: >-
    Clause-by-clause conformance checklist for the ABB Robot Web Services adapter,
    derived from ABB Robot Web Services 2.0 (OmniCore, RobotWare 7). An item passes when the simulator's observable response
    to a call matches the response the document specifies, in value, in type and
    in ordering.
  vendor: ABB
  interface: Robot Web Services
  document: 'ABB Robot Web Services 2.0 (OmniCore, RobotWare 7)'
  nominal_state_rate_hz: 125
  checklist: tests/conformance/abb_rws_checklist.yaml
  # Stated so it cannot be read as more than it is: simulator and adapter were
  # both built from this document, so a misreading of the document would be
  # invisible to the test. A pass shows the adapter speaks the documented
  # protocol; it does not show interoperability with a physical controller.
  establishes: documented-protocol conformance only
outputs:
  log: data/conformance_log.csv
