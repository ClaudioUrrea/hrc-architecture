# Configuration for manuscript electronics-4587969.
# Every quantity produced by this file is SIMULATED: the robot, sensor and PLC
# endpoints are vendor software simulators, not physical equipment.
seed_manifest: config/seeds.json
platform:
  os: Ubuntu 22.04.4 LTS
  kernel: 5.15.0-105 PREEMPT_RT
  isolcpus: [6, 7]
  scheduler: {policy: SCHED_FIFO, priority: 90}
  cpu: Intel Core i7-10700K
  accelerator: NVIDIA Jetson Xavier NX (JetPack 5.1.2, CUDA 11.4, TensorRT 8.5.2, 15 W 6-core)
toolchain:
  compiler: GCC 11.4.0
  std: c++17
  flags: [-O2, -march=native]
  open62541: 1.3.9
  pymodbus: 3.6.6
  ethercat_master: IgH 1.5.2
  qpoases: 3.2.1
simulators:
  cell: CoppeliaSim 4.6.0 rev18 (Bullet 2.78, 5 ms step)
  cameras: 6x Intel RealSense D435 model, 1280x720 @ 30 fps

run:
  name: ablation_A1
  description: layered, but the inter-layer transport is a loopback socket instead of a shared-memory ring
  scheduling: SCHED_FIFO prio 90 on an isolated core; watchdog enabled
  controller: learned CBF + MPC (identical across every configuration)
  # Round 2: 30 condition cells per configuration, not one replayed workload.
  design:
    human_trajectory_seeds: [11, 23, 37, 51, 73]
    # S1 pick-and-place assembly, S2 collaborative screwdriving, S4 material handling with occlusions
    # (Section 9.6); the three scenarios in which the human and the robot share the workspace most
    scenarios: [S1, S2, S4]
    background_loads: [idle, loaded]
    cells: 30
  cycles_per_cell: 10000
outputs:
  telemetry: data/ablation_cycles.parquet
  # Execution time and release interval are recorded as SEPARATE columns. The
  # first submission conflated them, reporting the release-interval standard
  # deviation (0.15 ms) in a column labelled as execution-time dispersion.
  columns: [cycle_index, config, seed, scenario, load, execution_ms, release_interval_ms, deadline_missed]
