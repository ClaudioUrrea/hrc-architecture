# Conformance checklist, derived clause by clause from the cited vendor
# document. status: reproduced | simplified | absent.
# An item passes when the simulator's observable response to a call matches
# the response the document specifies, in value, in type and in ordering.
# An 'absent' item is NOT a failure: it records a behaviour that cannot be
# exercised in simulation at all, and about which this paper therefore makes
# no claim anywhere.
interface: kuka
items:
