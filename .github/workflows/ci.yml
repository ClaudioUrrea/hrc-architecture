name: reproduce

on: [push, pull_request]

jobs:
  reproduce:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run the analysis pipeline
        run: python analysis/run_all.py --out out/results.json
      - name: Check every value against the manuscript
        run: python analysis/check_against_paper.py --results out/results.json
      - name: Regenerate the figures
        run: cd figures && python p2_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            out/results.json
            figures/figures_p2_electronics/
